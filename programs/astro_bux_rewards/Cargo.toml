[package]
name = "astro_bux_rewards"
version = "0.2.0"
description = "Admin-controlled Astro Bux SPL token rewards"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "astro_bux_rewards"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["associated_token", "token"] }
